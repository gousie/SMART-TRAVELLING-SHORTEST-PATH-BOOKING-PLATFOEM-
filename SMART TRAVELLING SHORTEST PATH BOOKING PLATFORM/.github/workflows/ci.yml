name: Python quality and integration
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: CTPDB_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d CTPDB_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:root@localhost:5432/CTPDB_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
      - name: Build container (deployment is intentionally not automatic)
        run: docker build -t railora:${{ github.sha }} .
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: CTPDB
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d CTPDB"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:root@localhost:5432/CTPDB
      STORAGE_SECRET: isolated-ci-demo-secret-not-for-production
      SEED_DEMO: "true"
      DEMO_AUTOSIGNIN: "false"
      RAILORA_E2E_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start disposable demo app
        run: |
          python main.py > server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(45):
              try:
                  urllib.request.urlopen('http://localhost:8080/api/health')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Demo server did not become ready')
          PY
      - run: pytest tests/test_e2e.py -v --junitxml=browser-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            browser-results.xml
            server.log
